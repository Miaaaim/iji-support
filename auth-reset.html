<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>重置密码 - i记</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #334155;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 20px;
      color: #0f172a;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      margin: 8px 0;
      line-height: 1.6;
      font-size: 14px;
      color: #64748b;
      max-width: 320px;
    }
    .fallback {
      display: none;
      margin-top: 20px;
    }
    .fallback.visible {
      display: block;
    }
    a {
      color: #0f172a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>正在打开 i记…</h1>
    <p id="status">请稍候，正在跳转到 App 以设置新密码。</p>
    <div id="fallback" class="fallback">
      <p>若未自动打开，请确认已安装「i记」，然后点击下方链接重试：</p>
      <p><a id="manual" href="#">打开 i记</a></p>
      <p>仍无法打开时，请回到 App 重新发起「忘记密码」。</p>
    </div>
  </div>
  <script>
    (function () {
      var hash = window.location.hash || "";
      var search = window.location.search || "";
      var deepLink = "wolaiye://auth/reset" + search + hash;
      var manual = document.getElementById("manual");
      var fallback = document.getElementById("fallback");
      var status = document.getElementById("status");

      if (manual) {
        manual.setAttribute("href", deepLink);
      }

      // No tokens / code → recovery link was incomplete or already consumed
      var hasHashToken = /access_token=/.test(hash) || /refresh_token=/.test(hash);
      var hasCode = /[?&]code=/.test(search);
      if (!hasHashToken && !hasCode) {
        status.textContent = "链接无效或已过期。请回到 App 重新申请重置密码。";
        fallback.classList.add("visible");
        return;
      }

      window.location.href = deepLink;

      setTimeout(function () {
        fallback.classList.add("visible");
        status.textContent = "如果 App 没有打开，请使用下方链接手动打开。";
      }, 1200);
    })();
  </script>
</body>
</html>
